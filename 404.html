<!DOCTYPE html>
<html lang="zh-CN" data-mode="blog">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>页面不存在 · 东芽果 DYG</title>
<meta name="description" content="这个页面不存在。" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#0b0b0d" />
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="theme.css?v=20261023131036" />
<script>
/* 首屏前定皮肤：晚一步就会先闪一下深色。与 data-mode 同理，必须内联同步执行。 */
(function () {
  try {
    /* 只认已知皮肤 */
    var OK = { soft: 1, organic: 1, dark: 1, neu: 1 };

    /* 本次会话手动选过，就听用户的 */
    var t = sessionStorage.getItem('dyg-theme');

    /* 否则按时段决定默认皮肤：
       06:00–17:59 用「柔和」（亮色），其余时间用「夜幕」（星空）。
       只写 sessionStorage 不写 localStorage —— 这样关掉标签页，
       下次打开又会回到时段默认，而不是永久固定成手动选的那套。 */
    if (!OK[t]) {
      var h = new Date().getHours();
      t = (h >= 6 && h < 18) ? 'soft' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'soft');
  }
})();
</script>
</head>
