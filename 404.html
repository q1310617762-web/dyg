<link rel="stylesheet" href="theme.css?v=20261023114015" />
<script>
/* 首屏前定皮肤：晚一步就会先闪一下深色。与 data-mode 同理，必须内联同步执行。 */
(function () {
  try {
    var t = localStorage.getItem('dyg-theme');
    /* 只认已知皮肤；没记录或未知值 → 默认皮肤 */
    var OK = { paper: 1, flat: 1, organic: 1, soft: 1, dark: 1, neu: 1 };
    if (!OK[t]) t = 'soft';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'soft');
  }
})();
</script>
</head>
