<script>
/* 首屏前定皮肤：晚一步就会先闪一下深色。与 data-mode 同理，必须内联同步执行。 */
(function () {
  try {
    var t = localStorage.getItem('dyg-theme');
    /* 没记录、或记录的是未知值 → 报纸（默认皮肤） */
    if (t !== 'dark' && t !== 'neu') t = 'paper';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'paper');
  }
})();
</script>
