<script>
/* 首屏前定皮肤：晚一步就会先闪一下深色。与 data-mode 同理，必须内联同步执行。 */
(function () {
  try {
    /* 只认已知皮肤 */
    var OK = { miko: 1, organic: 1, dark: 1, ly: 1 };

    /* 本次会话手动选过，就听用户的 */
    var t = sessionStorage.getItem('dyg-theme');

    /* 旧 id 迁移：neu（新拟物）已被「乐园」取代，soft 已被「八重」取代。
       不映射的话，上一版选过第四套的人一跳页就被判成无效、退回时段默认。 */
    var ALIAS = { neu: 'ly', soft: 'miko' };
    if (ALIAS[t]) t = ALIAS[t];

    /* 否则按时段决定默认皮肤：
       06:00–17:59 用「柔和」（亮色），其余时间用「夜幕」（星空）。
       只写 sessionStorage 不写 localStorage —— 这样关掉标签页，
       下次打开又会回到时段默认，而不是永久固定成手动选的那套。 */
    if (!OK[t]) {
      var h = new Date().getHours();
      t = (h >= 6 && h < 18) ? 'miko' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'miko');
  }
})();
</script>
